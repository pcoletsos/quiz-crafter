name: Contribution Guardrails

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  guardrails:
    name: guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate contribution guardrails
        run: python .github/scripts/validate_contribution_guardrails.py
